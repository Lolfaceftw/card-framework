providers:
  - id: vllm_default
    description: OpenAI-compatible vLLM endpoint running locally; pin the served model with CARD_FRAMEWORK_VLLM_MODEL or VLLM_MODEL for reproducible benchmark runs. The SPoRC budget path keeps thinking enabled when that pin resolves to Qwen/Qwen3.5-27B.
    required_env: []
    llm:
      _target_: card_framework.providers.vllm_provider.VLLMProvider
      base_url: "http://127.0.0.1:8000/v1"
      api_key: "EMPTY"

  - id: transformers_local
    description: Local Transformers backend for tool-calling compatibility checks.
    required_env: []
    llm:
      _target_: card_framework.providers.transformers_provider.TransformersProvider
      model: "Salesforce/Llama-xLAM-2-3b-fc-r"
      device_map: "auto"
      torch_dtype: "bfloat16"

  - id: deepseek_chat
    description: DeepSeek API backend.
    required_env: ["DEEPSEEK_API_KEY"]
    llm:
      _target_: card_framework.providers.deepseek_provider.DeepSeekProvider
      api_key: "$ENV{DEEPSEEK_API_KEY}"
      model: "deepseek-chat"
      base_url: "https://api.deepseek.com"

  - id: deepseek_v4_flash
    description: DeepSeek V4 Flash/Fast API backend.
    required_env: ["DEEPSEEK_API_KEY"]
    llm:
      _target_: card_framework.providers.deepseek_provider.DeepSeekProvider
      api_key: "$ENV{DEEPSEEK_API_KEY}"
      model: "deepseek-v4-flash"
      base_url: "https://api.deepseek.com"

  - id: openai_gpt_5_4_mini
    description: OpenAI GPT-5.4 mini with reasoning disabled for SPoRC budget sweeps.
    required_env: ["OPENAI_API_KEY"]
    llm:
      _target_: card_framework.providers.openai_provider.OpenAIProvider
      api_key: "$ENV{OPENAI_API_KEY}"
      model: "gpt-5.4-mini"
      enable_thinking: false

  - id: anthropic_claude_haiku_4_5
    description: Anthropic Claude Haiku 4.5 with thinking disabled for SPoRC budget sweeps.
    required_env: ["ANTHROPIC_API_KEY"]
    llm:
      _target_: card_framework.providers.anthropic_provider.AnthropicProvider
      api_key: "$ENV{ANTHROPIC_API_KEY}"
      model: "claude-haiku-4-5"
      enable_thinking: false

  - id: deepseek_judge
    description: Dedicated DeepSeek reasoner backend for reference-free scoring.
    required_env: ["DEEPSEEK_API_KEY"]
    llm:
      _target_: card_framework.providers.deepseek_provider.DeepSeekProvider
      api_key: "$ENV{DEEPSEEK_API_KEY}"
      model: "deepseek-reasoner"
      base_url: "https://api.deepseek.com"

  - id: glm_46
    description: GLM backend via ZAI SDK.
    required_env: ["ZAI_API_KEY"]
    llm:
      _target_: card_framework.providers.glm_provider.GLMProvider
      api_key: "$ENV{ZAI_API_KEY}"
      model: "glm-4.6"

  - id: google_gemini
    description: Google GenAI backend.
    required_env: ["GEMINI_API_KEY"]
    llm:
      _target_: card_framework.providers.google_genai_provider.GoogleGenAIProvider
      api_key: "$ENV{GEMINI_API_KEY}"
      model: "gemini-2.5-pro"

  - id: google_gemini_3_1_pro_preview_judge
    description: Gemini 3.1 Pro Preview judge with default thinking enabled.
    required_env: ["GEMINI_API_KEY"]
    llm:
      _target_: card_framework.providers.google_genai_provider.GoogleGenAIProvider
      api_key: "$ENV{GEMINI_API_KEY}"
      model: "gemini-3.1-pro-preview"
      enable_thinking: true

  - id: huggingface_toolace
    description: Hugging Face ToolACE backend.
    required_env: ["HF_API_TOKEN"]
    llm:
      _target_: card_framework.providers.huggingface_provider.HuggingfaceProvider
      api_key: "$ENV{HF_API_TOKEN}"
      model: "Team-ACE/ToolACE-8B"
      base_url: "https://router.huggingface.co/hf-inference/v1/"

  - id: nanbeige_thinking
    description: Nanbeige model through Hugging Face router.
    required_env: ["HF_API_TOKEN"]
    llm:
      _target_: card_framework.providers.nanbeige_provider.NanbeigeProvider
      api_key: "$ENV{HF_API_TOKEN}"
      model: "Nanbeige/Nanbeige4-3B-Thinking-2511"
      base_url: "https://router.huggingface.co/hf-inference/v1/"
